services:
  db:
    image: postgres:18
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - steam_pg_data:/var/lib/postgresql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./fixtures.sql:/docker-entrypoint-initdb.d/02-fixtures.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  steam_pg_data:
